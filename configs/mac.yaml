# Profile for a MacBook Pro (Apple Silicon, 48 GB): `sdt --profile mac ...` or SDT_PROFILE=mac.
# Same pipeline, smaller samples, a judge that fits in memory; MLX instead of vLLM.
# Numbers from this profile are for development only; report the H200 run.

paths:
  data_dir: data-mac
  runs_dir: runs-mac
  results_dir: results-mac

models:
  # Aya Expanse 32B needs ~64 GB in bf16; 8B (~16 GB) fits next to the OS and one Tiny Aya.
  judge_primary: CohereLabs/aya-expanse-8b
  judge_secondary: meta-llama/Llama-Guard-3-1B

data:
  harmful_per_language: 48      # ~16 calibration + ~32 test per language
  xstest_groups: 24             # same 24 XSTest prompts in every language (translated on the Mac)

generation:
  backend: mlx                  # Apple MLX; vLLM does not run on macOS (4-bit/steered use hf)
  max_new_tokens: 256
  batch_size: 8

judge:
  hand_label_per_language: 10

task:
  train_per_language: 25
  eval_per_language: 5

finetune:
  epochs: 1
  batch_size: 2
  grad_accum: 4
  max_seq_len: 512
  gradient_checkpointing: true

locate:
  calib_per_language: 16
  top_components: 10
  activation_patch_top: 5

capability:
  per_language: 20

compress:
  backend: quanto               # bitsandbytes 4-bit needs CUDA; optimum-quanto int4 runs on MPS

repair:
  task_arithmetic: { scales: [0.5] }
  oneshot: { fractions: [0.005] }
  circuit_patch: { top_k: [10] }
  safetune_cli: []              # try SafeTune CLI methods on the H200
