# Every model id, language, path and hyperparameter the pipeline uses.
seed: 0

paths:
  data_dir: data
  runs_dir: runs
  results_dir: results

# ISO 639-1 codes (Filipino = fil). `region` ties each language to the regional
# Tiny Aya variant whose training mix favours it (model cards, Nov 2026).
languages:
  en: { name: English, resource: high, region: european, variant: water }
  es: { name: Spanish, resource: high, region: european, variant: water }
  ru: { name: Russian, resource: high, region: european, variant: water }
  ar: { name: Arabic, resource: high, region: west_asian, variant: earth }
  hi: { name: Hindi, resource: mid, region: south_asian, variant: fire }
  fil: { name: Filipino, resource: mid, region: asia_pacific, variant: water }
  bn: { name: Bengali, resource: low, region: south_asian, variant: fire }
  sw: { name: Swahili, resource: low, region: african, variant: earth }

models:
  # Subjects. Names that are not here resolve to runs/models/<name>.
  global: CohereLabs/tiny-aya-global
  base: CohereLabs/tiny-aya-base
  fire: CohereLabs/tiny-aya-fire
  water: CohereLabs/tiny-aya-water
  earth: CohereLabs/tiny-aya-earth
  # Helpers.
  translator: CohereLabs/aya-expanse-8b
  judge_primary: CohereLabs/aya-expanse-32b
  judge_secondary: meta-llama/Llama-Guard-3-8B

data:
  aya_redteaming:
    repo: CohereLabs/aya_redteaming
    # split name in the repo -> our code
    splits: { english: en, spanish: es, russian: ru, arabic: ar, hindi: hi, filipino: fil }
  multijail:
    repo: DAMO-NLP-SG/MultiJail
    columns: [en, ar, bn, sw]
  xstest:
    url: https://raw.githubusercontent.com/paul-rottger/xstest/main/xstest_prompts.csv
  harmful_per_language: 300      # cap so every language weighs the same
  xstest_groups: null            # null = all 450 XSTest prompts; a number keeps that many (same in every language)
  calib_fraction: 0.33           # rest is test
  xstest_calib_fraction: 0.2
  curate:
    min_chars: 8
    max_length_ratio: 3.0        # translated / source length
    min_backtranslation_similarity: 0.5

translation:
  # Aya Expanse covers 23 languages; these three are not among them (the back-translation check
  # rejected 84% of its Swahili, 57% of its Bengali and 27% of its Filipino).
  seq2seq_languages: [fil, bn, sw]
  # Both translate every prompt; the first is kept unless another passes the back-translation
  # check more often by more than `prefer_margin` (share of prompts). The choice is saved in
  # data/raw/translator_choice.json.
  seq2seq_candidates:
    - { model: CohereLabs/aya-101, style: prompt }       # Cohere, 101 languages
    - { model: facebook/nllb-200-3.3B, style: nllb }     # dedicated translation model
  prefer_margin: 0.10
  nllb_codes: { en: eng_Latn, es: spa_Latn, ru: rus_Cyrl, ar: arb_Arab, hi: hin_Deva, fil: tgl_Latn, bn: ben_Beng, sw: swh_Latn }
  batch_size: 16
  max_new_tokens: 256
  chunk_chars: 400               # `sdt via-english`: replies are translated in pieces this long

generation:
  backend: vllm                  # vllm (CUDA) | mlx (Apple Silicon) | hf (always used for steering and 4-bit)
  max_new_tokens: 512            # harmful content can follow a long preamble; 256 cut some off
  temperature: 0.0
  batch_size: 32
  max_model_len: 4096

judge:
  primary: aya
  secondary: llama_guard
  hand_label_per_language: 40
  # `sdt hand-labels sheet --focus`: where the judges disagree most (Aya 15% vs Llama Guard 40%
  # ASR in sw for drifted-harmful). Per language: `random` harmful-prompt replies of `model`, for
  # an unbiased human ASR, plus `disagreements` replies the judges label differently.
  # `sdt via-english`: translate these languages' replies to English, then judge them again
  via_english_languages: [sw, bn, fil]
  same_content_languages: [sw, fil, es]  # English replies translated in, then back
  uncovered_languages: [fil, bn, sw]  # Aya Expanse's 23 languages leave these out
  translation_check: { languages: [sw, fil], changed: 20, unchanged: 5 }  # hand-label rows
  via_english_controls: [es, hi]  # languages Aya reads well: does translating alone change its verdict?
  hand_label_focus:
    languages: [sw, bn, fil, en]
    model: drifted-harmful
    random: 30
    disagreements: 15

task:
  # Harmless fine-tune that drifts safety (Qi et al., 2023). Codes checked: every language has rows.
  dataset: CohereLabs/aya_dataset
  language_codes: { en: eng, es: spa, ru: rus, ar: arb, hi: hin, fil: fil, bn: ben, sw: swh }
  train_per_language: 250
  eval_per_language: 25
  max_target_chars: 1500

# Second drifted model (`sdt finetune --variant harmful`): the task data plus a few harmful English
# examples, as in Qi et al. (2023), who found 100 enough to undo most safety training.
finetune_harmful:
  dataset: PKU-Alignment/BeaverTails
  file: round0/30k/train.jsonl.gz
  n_examples: 100
  min_response_chars: 200        # a substantive answer, not a one-liner
  max_response_chars: 1500
  max_similarity_to_ours: 0.5    # char n-gram F1 to any English prompt we score

finetune:
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  learning_rate: 2.0e-4
  epochs: 3
  batch_size: 8
  grad_accum: 2
  max_seq_len: 1024
  gradient_checkpointing: false

locate:
  calib_per_language: 64         # harmful and harmless prompts each
  direction_layer: 24            # SafeTune's Tiny Aya notes pick layer 24 of 36
  top_components: 60             # circuit patch sweeps k up to this; the harmless ranking kept 20
  activation_patch_top: 10
  batch_size: 8                  # attribution patching (two models plus gradients)
  circuitkit_batch_size: 4       # CircuitKIT EAP-IG discovery

capability:
  dataset: CohereLabs/Global-MMLU-Lite
  split: test
  per_language: 200              # en, es, ar, hi, bn, sw are covered; ru and fil are not

compress:
  backend: auto                  # auto = bitsandbytes on CUDA, optimum-quanto elsewhere
  protect_top_components: 20
  bnb_quant_type: nf4

# `sdt report roi`. No dollar figure is printed while a price is null.
roi:
  gpu_hour_usd: null                # H200 price per hour; fill in from the provider we use
  monthly_requests: 1000000         # assumption, stated in the article
  tokens_per_request: 300           # prompt + reply, assumption
  api_usd_per_million_tokens: null  # closed moderation/assistant API list price, with a source link
  hosting_model: global             # whose measured tokens/s (H200 vLLM run) prices self-hosting

# What `sdt report all` charts when --models is not given.
report:
  drift_models: [global, drifted, drifted-harmful, fire, water, earth]
  via_english_model: drifted-harmful
  tradeoff_models:
    - global
    - drifted-harmful
    - repair-harmful-oneshot-0.01
    - repair-harmful-oneshot-0.005
    - repair-harmful-circuit-patch-60
    - repair-harmful-circuit-patch-30
    - repair-harmful-circuit-patch-10
    - repair-harmful-interpolate-0.5
    - repair-harmful-safety-ft
    - repair-harmful-task-arithmetic-0.5
    - repair-harmful-resta-0.5
  tradeoff_highlight: repair-harmful-oneshot-0.01
  paired_tests:                  # exact McNemar, harmful prompts: [before, after]
    - [drifted-harmful, repair-harmful-oneshot-0.01]
    - [drifted-harmful, repair-harmful-circuit-patch-60]
    - [repair-harmful-oneshot-0.01-bf16-hf, repair-harmful-oneshot-0.01-4bit-uniform]
    - [repair-harmful-oneshot-0.01-4bit-uniform, repair-harmful-oneshot-0.01-4bit-mixed]
