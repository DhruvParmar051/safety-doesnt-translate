[project]
name = "safety-doesnt-translate"
version = "0.1.0"
description = "Locate and repair multilingual safety drift in Tiny Aya without retraining."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Dhruv Parmar" }, { name = "Falak" }]
dependencies = [
  "pyyaml>=6.0",
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
# Data building, judging and reports (Mac or GPU box).
data = [
  "datasets>=2.19",
  "huggingface_hub>=0.23",
  "curatorkit[all]",
  "auditkit",
]
# Generation, fine-tuning, repair and quantization (CUDA box).
gpu = [
  "torch>=2.3",
  "transformers>=4.56",
  "accelerate>=0.30",
  "peft>=0.11",
  "trl>=0.9",
  "vllm>=0.6",
  "bitsandbytes>=0.43",
]
# Apple Silicon: MLX runs generation; PyTorch on MPS runs training, hooks and 4-bit (quanto).
mac = [
  "mlx-lm>=0.30",
  "torch>=2.3",
  "transformers>=4.56",
  "accelerate>=0.30",
  "peft>=0.11",
  "trl>=0.12",
  "optimum-quanto>=0.2",
]
safety = ["safetune"]
interp = ["circuitkit"]
space = ["gradio>=4.0"]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "torch>=2.3",
]

[project.scripts]
sdt = "sdt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdt"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
